<style>
/* Layout: playful autumn "periodic table" of November. Groups I–VIII as columns, weeks as rows; minimal text outside the table; each cell opens a window with tabs (students / class teacher). Single committed light autumn look. */
:root{
  color-scheme:light;
  --sky1:#FFF0D9; --sky2:#FFD4B8; --sky3:#FFC1A6;
  --ink:#3A2416; --muted:#8A6650; --paper:#FFFDF8; --line:#F1D2B6; --soft:#FFF4E6;
  --w1a:#FF7A9C; --w1b:#E8436B;
  --w2a:#FFCF4A; --w2b:#FF9A1F;
  --w3a:#5CC2FF; --w3b:#2D7FE0;
  --w4a:#C094FF; --w4b:#8A55E6;
  --w5a:#6BE0A6; --w5b:#20B271;
  --cya:#3FD8D2; --cyb:#139E9E;
  --display:"Comfortaa","Nunito",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
html,body{background:var(--sky1)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 55%,var(--sky3) 100%);min-height:100%}
[hidden]{display:none!important}
body.modal-open{overflow:hidden}
#leaves{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding-block:22px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
.wrap>*{min-width:0}

header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 20px;flex-wrap:wrap}
.ttlblock{display:grid;gap:4px}
.eyebrow{font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-weight:900;font-size:clamp(28px,5.4vw,58px);line-height:.98;margin:0;letter-spacing:-.01em;text-wrap:balance}

.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:800;font-size:14px}
.bar{width:90px;height:10px;border-radius:99px;background:var(--soft);overflow:hidden;border:1px solid var(--line)}

.board{background:rgba(255,253,248,.72);border:3px solid #fff;border-radius:26px;padding:14px 14px 12px;box-shadow:0 12px 40px rgba(160,80,30,.18);backdrop-filter:blur(3px)}
.scroll{overflow-x:auto;padding:12px 6px 8px;-webkit-overflow-scrolling:touch}

.fb{margin-top:14px;padding-top:12px;border-top:3px dotted var(--line)}

.ph{display:grid;align-content:center;gap:2px;padding-right:6px;border-right:3px dotted var(--line)}
.ph b{font-family:var(--display);font-size:26px;line-height:1;font-weight:900}

.el{position:relative;aspect-ratio:1/1.12;border:3px solid #fff;border-radius:22px;padding:7px 8px;text-align:left;font:inherit;cursor:pointer;

@keyframes owl{0%,100%{transform:translateY(0) rotate(0)}20%{transform:translateY(-4px) rotate(-10deg) scaleX(1.12)}40%{transform:translateY(0) rotate(8deg)}60%{transform:translateY(-3px) rotate(-6deg) scaleX(1.1)}80%{transform:translateY(0) rotate(0)}}

.el.leafbtn:hover{transform:scale(1.12) rotate(0deg);box-shadow:none;animation-play-state:paused}
.el.leafbtn .leaf{position:absolute;left:-26%;top:-26%;width:152%;height:152%;overflow:visible;animation:leafglow 1.8s ease-in-out infinite}
.el.leafbtn .lin{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:1px;padding-bottom:22%;text-shadow:0 2px 3px rgba(120,30,0,.45)}
.el.leafbtn .lnum{font-family:var(--display);font-weight:900;font-size:16px;line-height:1}
.el.leafbtn .lsym{font-family:var(--display);font-weight:900;font-size:clamp(26px,3vw,34px);line-height:1}

.fb .el{aspect-ratio:1/1;background:linear-gradient(155deg,#FFFFFF,#FFF0DE);color:var(--ink);border-color:var(--line)}

.ov{position:fixed;inset:0;z-index:50;background:rgba(58,36,22,.45);backdrop-filter:blur(4px);display:grid;place-items:center;
  padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}

.bigel{width:104px;aspect-ratio:1/1.12;border-radius:18px;background:rgba(255,255,255,.22);border:3px solid currentColor;padding:8px 10px;display:flex;flex-direction:column;justify-content:space-between;transform:rotate(-4deg);margin-bottom:16px}

<script>

const YEAR=2026, MONTH=11;

const W={
 1:{n:"Тиждень добрих справ",a:"--w1a",b:"--w1b",tx:"#fff",dates:"02–06.11"},

}

/* ---------- window ---------- */
const ORDER=[...E.map((e,i)=>"E:"+i).sort((a,b)=>{const x=E[+a.split(":")[1]],y=E[+b.split(":")[1]];return x.u-y.u||x.p-y.p||x.g-y.g}),...F.map((f,i)=>"F:"+i)];
const get=k=>{const[l,i]=k.split(":");return l==="E"?E[+i]:F[+i]};
const CHAT=new Set(["pad","padlet","wordwall","answer","learningapps","forms","genially"]);
const linkBtns=(arr,alt)=>{const note=(arr||[]).some(k=>CHAT.has(k));return (arr||[]).filter(k=>L[k]&&!CHAT.has(k)).map(k=>`<a class="lnk ${alt?"alt":""}" href="${L[k][1]}" target="_blank" rel="noopener">${L[k][0]} ↗</a>`).join("")+(note?`<span class="form" style="font-size:14px">🔗 Посилання на нашу дошку чи гру — у класному чаті</span>`:"")};
function dateLine(e,key){
  if(key[0]==="F")return e.n==="∞"?"щодня протягом листопада":"раз за місяць";
  if(/^\d+$/.test(e.n)){const wd=new Date(YEAR,MONTH-1,+e.n).getDay();return `${e.n} листопада, ${DAYS[(wd+6)%7]}`}
  return e.noble?"тиждень "+W[e.p].dates:"протягом тижня "+W[e.p].dates;
}
let lastCell=null;
function openWin(key){
  sel=key;const e=get(key),w=pal(e),win=$("#win"),ov=$("#ov");
  win.setAttribute("style",`--a:var(${w.a});--b:var(${w.b});--tx:${w.tx}`);
  const open=isOpen(e);
  if(open&&!seen.has(key)){seen.add(key);store.set("pn_seen",[...seen])}
  const heroCls=!open?"lockh":e.cls?e.cls:key[0]==="F"?"fbk":e.noble?"nobleh":"";
  let html=`<div class="hero ${heroCls}">
     <button class="x" id="wx" type="button" aria-label="Закрити">×</button>
     <div class="bigel"><div class="top"><span>${e.n}</span><span>${e.m||""}</span></div><div class="sym">${e.s}</div><div class="nm">${e.nm}</div></div>
     <div class="ttl"><div class="wk">${w.n}</div><h3 id="wtitle">${open?e.nm:"Елемент ще запечатано"}</h3><div class="dt">${dateLine(e,key)}</div></div>
     <div class="bigpic" aria-hidden="true">${open?e.pic:"🔒"}</div>
   </div>`;
  if(!open){
    html+=`<div class="lockmsg"><div style="font-size:60px">🍁🔒🍁</div><div>Цей елемент відкриється <b>${e.u} листопада</b>.</div><div style="color:var(--muted);font-size:15px">Терпіння, юний алхіміку! А поки відкрий сьогоднішній 🍁</div></div>`;
  }else{
    const wheel=e.wheel?`<div class="wheelbox"><div class="wheelwrap"><canvas id="wh" width="440" height="440" aria-label="Колесо з варіантами"></canvas><div class="ptr"></div></div>
      <div style="display:grid;gap:10px;min-width:0"><div class="lab">🎡 Колесо листопада</div><button class="spin" id="spin" type="button">Крутити!</button><div class="wres" id="wres" aria-live="polite">Натисни «Крутити!»</div></div></div>`:"";
    html+=`<div class="pane" id="p-stu">
        <div class="form">${e.f||""}</div>
        <div class="bubble">${e.stu}</div>
        ${e.todo?`<div class="blk"><div class="lab">Що робимо</div><div>${e.todo}</div></div>`:""}
        ${e.sl?`<div class="links">${linkBtns(e.sl)}</div>`:""}
        ${wheel}
        ${e.fun?`<div class="fun">${e.fun}</div>`:""}
      </div>`;
  }
  html+=`<div class="wnav"><button id="wp" type="button">← попередній</button><button id="wn" type="button">наступний →</button></div>`;
  win.innerHTML=html;
  /* if the frame is as tall as the page, place the window next to the clicked cell */
  const tall=innerHeight>=document.documentElement.scrollHeight-4;
  ov.classList.toggle("tall",tall);
  if(tall){const c=document.querySelector(`.el[data-k="${key}"]`)||lastCell;const top=c?c.getBoundingClientRect().top+scrollY-40:scrollY;ov.style.height=document.documentElement.scrollHeight+"px";win.style.marginTop=Math.max(12,top)+"px"}
  else{ov.style.height="";win.style.marginTop=""}
  ov.hidden=false;document.body.classList.add("modal-open");
  $("#wx").onclick=closeWin;$("#wp").onclick=()=>step(-1);$("#wn").onclick=()=>step(1);
  if(open){
    if(e.wheel)setupWheel(e.wheel);
  }
  win.scrollTop=0;$("#wx").focus({preventScroll:true});
  renderTable();
}
function closeWin(){$("#ov").hidden=true;document.body.classList.remove("modal-open");const c=document.querySelector(`.el[data-k="${sel}"]`);if(c)c.focus({preventScroll:true})}
function step(d){const i=ORDER.indexOf(sel);openWin(ORDER[(i+d+ORDER.length)%ORDER.length])}
$("#ov").addEventListener("click",ev=>{if(ev.target.id==="ov")closeWin()});
document.addEventListener("click",ev=>{const b=ev.target.closest(".el");if(b){lastCell=b;openWin(b.dataset.k)}});
document.addEventListener("keydown",ev=>{if($("#ov").hidden)return;if(ev.key==="Escape")closeWin();if(ev.key==="ArrowRight")step(1);if(ev.key==="ArrowLeft")step(-1)});

/* ---------- wheel ---------- */
function setupWheel(items){
  const cv=$("#wh"),ctx=cv.getContext("2d"),N=items.length,R=210,C=220,TAU=Math.PI*2,seg=TAU/N;
  const cols=["#FF7A9C","#FFCF4A","#5CC2FF","#C094FF","#6BE0A6","#FF9A3C","#3FD8D2","#FFB3C7"];
  let ang=0,spinning=false;
  function draw(){
    ctx.clearRect(0,0,440,440);
    for(let i=0;i<N;i++){
      const a0=ang+i*seg-Math.PI/2,a1=a0+seg;
      ctx.beginPath();ctx.moveTo(C,C);ctx.arc(C,C,R,a0,a1);ctx.closePath();ctx.fillStyle=cols[i%cols.length];ctx.fill();
      ctx.strokeStyle="#fff";ctx.lineWidth=4;ctx.stroke();
      ctx.save();ctx.translate(C,C);ctx.rotate(a0+seg/2);ctx.textAlign="right";ctx.fillStyle="#3A2416";
      ctx.font=`800 ${N>10?15:18}px Nunito, sans-serif`;
      let t=items[i][0];if(t.length>21)t=t.slice(0,20)+"…";ctx.fillText(t,R-12,6);ctx.restore();
    }
    ctx.beginPath();ctx.arc(C,C,28,0,TAU);ctx.fillStyle="#fff";ctx.fill();ctx.lineWidth=5;ctx.strokeStyle="#3A2416";ctx.stroke();
    ctx.font="24px serif";ctx.textAlign="center";ctx.fillText("🍁",C,C+8);
  }
  draw();
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const mod=x=>((x%TAU)+TAU)%TAU;
  $("#spin").onclick=()=>{
    if(spinning)return;spinning=true;
    const target=Math.floor(Math.random()*N),final=-(target*seg+seg/2);
    const start=ang,dest=start+(reduce?0:5*TAU)+mod(final-start),dur=reduce?1:3200,t0=performance.now();
    $("#wres").textContent="Крутиться…";
    function anim(t){const k=Math.min(1,(t-t0)/dur),ease=1-Math.pow(1-k,4);ang=start+(dest-start)*ease;draw();
      if(k<1)requestAnimationFrame(anim);else{ang=mod(dest);draw();spinning=false;$("#wres").innerHTML="🎉 "+items[target][0]+'<div class="wexp">'+items[target][1]+'</div>'}}
    requestAnimationFrame(anim);
  };
}

renderTable();

/* ---------- falling leaves ---------- */
(function(){
  const cv=$("#leaves"),ctx=cv.getContext("2d");const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const em=["🍁","🍂","🍃","🍁","🍂"];let W0=1,H0=1;const lv=[];
  function size(){W0=cv.width=innerWidth;H0=cv.height=Math.min(innerHeight,2400)}
  size();addEventListener("resize",size);
  for(let i=0;i<20;i++)lv.push({x:Math.random()*W0,y:Math.random()*H0,s:16+Math.random()*18,v:.3+Math.random()*.7,a:Math.random()*6,e:em[i%em.length],sw:Math.random()*2});
  function frame(){
    ctx.clearRect(0,0,W0,H0);ctx.globalAlpha=.5;
    for(const l of lv){
      if(!reduce){l.y+=l.v;l.a+=.01;l.x+=Math.sin(l.a)*.6*l.sw;if(l.y>H0+30){l.y=-30;l.x=Math.random()*W0}}
      ctx.save();ctx.translate(l.x,l.y);ctx.rotate(Math.sin(l.a)*.6);ctx.font=`${l.s}px serif`;ctx.fillText(l.e,0,0);ctx.restore();
    }
    if(!reduce)requestAnimationFrame(frame);
  }
  frame();
})();
</script>
